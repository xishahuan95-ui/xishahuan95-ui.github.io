<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小角落</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
  }
  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 40px 30px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    backdrop-filter: blur(10px);
  }
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: white;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    color: #888;
    font-size: 15px;
    margin-bottom: 20px;
  }
  .section {
    margin-bottom: 25px;
  }
  .section h2 {
    font-size: 18px;
    margin-bottom: 12px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section p, .section li {
    color: #666;
    line-height: 1.8;
    font-size: 15px;
  }
  .section ul {
    list-style: none;
    padding-left: 0;
  }
  .section li {
    padding: 6px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .section li:last-child {
    border-bottom: none;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
  }
  .links {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
  }
  .link-btn {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 25px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.2s;
  }
  .link-btn:hover {
    transform: translateY(-2px);
  }
  .link-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
  }
  .link-secondary {
    background: #f5f5f5;
    color: #555;
  }
  .footer {
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    margin-top: 30px;
  }
  @media (max-width: 600px) {
    .card { padding: 25px 20px; }
    h1 { font-size: 24px; }
    .avatar { width: 80px; height: 80px; font-size: 36px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="card">
    <div class="header">
      <div class="avatar">🌻</div>
      <h1>你的名字</h1>
      <p class="subtitle">随便写点什么的地方</p>
    </div>

    <div class="section">
      <h2>👋 关于我</h2>
      <p>嗨，我是你。这里是我随便记录生活、想法和乱七八糟东西的小角落。不定时更新，随缘访问。</p>
    </div>

    <div class="section">
      <h2>💡 我喜欢</h2>
      <div class="tags">
        <span class="tag">读书</span>
        <span class="tag">听歌</span>
        <span class="tag">看电影</span>
        <span class="tag">散步</span>
        <span class="tag">折腾新东西</span>
        <span class="tag">发呆</span>
      </div>
    </div>

    <div class="section">
      <h2>📝 最近在搞</h2>
      <ul>
        <li>📖 在读《XXX》</li>
        <li>🎵 单曲循环一首歌</li>
        <li>🛠️ 折腾个人网页（就是你现在看到的这个）</li>
        <li>☕ 学做手冲咖啡</li>
      </ul>
    </div>

    <div class="section">
      <h2>🔗 找到我</h2>
      <div class="links">
        <a href="#" class="link-btn link-primary">微博</a>
        <a href="#" class="link-btn link-secondary">小红书</a>
        <a href="#" class="link-btn link-secondary">邮箱</a>
      </div>
    </div>
  </div>

  <p class="footer">Made with ☕ · 2026</p>
</div>
</body>
</html>
