<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xishahuan.github.io</title>
<style>
  :root {
    --bg: #1a1a1f; --card: #25252d; --text: #e0e0e0;
    --accent: #9b59b6; --border: #444;
  }
  [data-theme="light"] { --bg:#fdf6f5; --card:#fff; --text:#333; --accent:#d65a9f; --border:#ddd; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: 'Courier New', sans-serif; }
  canvas { position:fixed; top:0; left:0; z-index:0; pointer-events:none; }
  .container { max-width:700px; margin:40px auto; padding:20px; position:relative; z-index:1; }
  .card { background:var(--card); padding:25px; border-radius:12px; margin-bottom:20px; border:1px solid var(--border); }
  h1, h3 { color:var(--accent); }
  .avatar { font-size:60px; text-align:center; cursor:pointer; }
  .tag { display:inline-block; background:rgba(155,89,182,0.2); border:1px solid var(--accent); padding:5px 12px; border-radius:20px; margin:5px; cursor:pointer; }
  .tag:hover { background:var(--accent); color:#fff; }
  .list-item { padding:10px; border-bottom:1px dashed var(--border); cursor:pointer; }
  .photo-wall { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .photo-wall img { width:100%; height:100px; object-fit:cover; border-radius:8px; cursor:pointer; filter:grayscale(40%) sepia(20%); }
  .photo-wall img:hover { filter:none; transform:scale(1.05); }
  /* 固定音乐按钮 */
  .music-btn { position:fixed; bottom:30px; right:30px; width:55px; height:55px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:24px; cursor:pointer; z-index:999; box-shadow:0 4px 10px rgba(0,0,0,0.6); }
  .music-btn.playing { animation: spin 4s linear infinite; }
  @keyframes spin { 100%{transform:rotate(360deg);} }
  .theme-btn { position:fixed; top:20px; right:20px; padding:8px 12px; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:20px; cursor:pointer; z-index:999; }
  .stickman { font-size:48px; display:inline-block; animation:walk 1s infinite alternate; }
  @keyframes walk { 0%{transform:translateX(-10px) rotate(-5deg);} 100%{transform:translateX(10px) rotate(5deg);} }
  .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; }
  .modal { background:var(--card); padding:25px; border-radius:12px; max-width:400px; width:90%; border:1px solid var(--accent); }
  .modal h3 { margin-top:0; }
  .close { float:right; cursor:pointer; font-size:20px; }
</style>
</head>
<body>
<canvas id="snowCanvas"></canvas>
<button class="theme-btn" onclick="toggleTheme()">🌙/☀️</button>

<!-- 音乐 -->
<audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_3f7c0b5b3c.mp3?filename=piano-sad-ambient-124632.mp3"></audio>
<button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎹</button>

<div class="container">
  <div class="card">
    <div class="avatar" onclick="avatarClick()">🦇</div>
    <h1 id="typeTarget"></h1>
    <div style="text-align:center">哥特暗黑 · 可爱碎片</div>
    <p style="text-align:center; margin-top:15px; cursor:pointer;" onclick="showModal('aboutModal')">✨ 点我看看「关于我」</p>
  </div>

  <div class="card">
    <h3>🏷️ 标签</h3>
    <span class="tag" onclick="showTag('读书')">读书</span>
    <span class="tag" onclick="showTag('听歌')">听歌</span>
    <span class="tag" onclick="showTag('看电影')">看电影</span>
    <span class="tag" onclick="showTag('散步')">散步</span>
    <span class="tag" onclick="showTag('折腾')">折腾</span>
    <span class="tag" onclick="showTag('发呆')">发呆</span>
  </div>

  <div class="card">
    <h3>📸 照片墙</h3>
    <div class="photo-wall">
      <img src="https://images.unsplash.com/photo-1505635552518-3448ff116af3?auto=format&fit=crop&w=300&q=80" onclick="showPhoto(this.src)">
      <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=300&q=80" onclick="showPhoto(this.src)">
      <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=300&q=80" onclick="showPhoto(this.src)">
    </div>
  </div>

  <div class="card">
    <h3>📝 最近在搞</h3>
    <div class="list-item" onclick="showItem('reading')">📖 在读一本书</div>
    <div class="list-item" onclick="showItem('music')">🎵 单曲循环</div>
    <div class="list-item" onclick="showItem('web')">🛠️ 折腾个人网页</div>
    <div class="list-item" onclick="showStickman()">🚶 火柴人走路</div>
  </div>

  <!-- 留言板 (Giscus) -->
  <div class="card">
    <h3>💬 留言板</h3>
    <script src="https://giscus.app/client.js"
        data-repo="xishahuan95-ui/xishahuan.github.io"
        data-repo-id="R_kgDONKw1wQ"
        data-category="Announcements"
        data-category-id="DIC_kwDONKw1w84CpK"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="dark"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
    </script>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="aboutModal" onclick="closeOnOverlay(event,'aboutModal')"><div class="modal"><span class="close" onclick="hideModal('aboutModal')">×</span><h3>关于我</h3><p>哥特暗黑风 + 可爱碎片，喜欢折腾网页和钢琴曲 🦇</p></div></div>
<div class="modal-overlay" id="tagModal" onclick="closeOnOverlay(event,'tagModal')"><div class="modal"><span class="close" onclick="hideModal('tagModal')">×</span><h3 id="tagTitle"></h3><p id="tagContent"></p></div></div>
<div class="modal-overlay" id="itemModal" onclick="closeOnOverlay(event,'itemModal')"><div class="modal"><span class="close" onclick="hideModal('itemModal')">×</span><h3 id="itemTitle"></h3><p id="itemContent"></p></div></div>
<div class="modal-overlay" id="photoModal" onclick="closeOnOverlay(event,'photoModal')"><div class="modal"><span class="close" onclick="hideModal('photoModal')">×</span><img id="bigPhoto" style="width:100%;border-radius:8px;"></div></div>
<div class="modal-overlay" id="stickmanModal" onclick="closeOnOverlay(event,'stickmanModal')"><div class="modal"><span class="close" onclick="hideModal('stickmanModal')">×</span><div class="stickman">🚶</div><p>火柴人走动了！</p></div></div>

<script>
  // 雪花
  const canvas=document.getElementById('snowCanvas'), ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  let flakes=[];
  for(let i=0;i<100;i++) flakes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*4+1, d:Math.random()*1+0.5});
  function drawSnow(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.beginPath(); flakes.forEach(f=>{ ctx.moveTo(f.x,f.y); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); f.y+=f.d; f.x+=Math.sin(f.y*0.01)*0.5; if(f.y>canvas.height) f.y=-10; }); ctx.fill(); requestAnimationFrame(drawSnow); }
  drawSnow();

  // 音乐控制（固定按钮 + 状态切换）
  const music=document.getElementById('bgMusic'), btn=document.getElementById('musicBtn');
  let isPlaying=false;
  function toggleMusic(){
    if(isPlaying){ music.pause(); btn.textContent='🔇'; btn.classList.remove('playing'); }
    else { music.play().catch(()=>{}); btn.textContent='🎹'; btn.classList.add('playing'); }
    isPlaying=!isPlaying;
  }
  // 尝试自动播放（部分浏览器允许）
  document.addEventListener('DOMContentLoaded', ()=>{ music.play().then(()=>{isPlaying=true;btn.textContent='🎹';btn.classList.add('playing');}).catch(()=>{btn.textContent='🔇';}) });

  // 打字机
  const txt="xishahuan"; let i=0;
  function type(){ if(i<txt.length){ document.getElementById('typeTarget').textContent+=txt[i++]; setTimeout(type,150); } }
  setTimeout(type,500);

  // 弹窗
  function showModal(id){ document.getElementById(id).style.display='flex'; }
  function hideModal(id){ document.getElementById(id).style.display='none'; }
  function closeOnOverlay(e,id){ if(e.target===document.getElementById(id)) hideModal(id); }
  function showPhoto(s){ document.getElementById('bigPhoto').src=s; showModal('photoModal'); }
  function showStickman(){ showModal('stickmanModal'); }
  const tagInfo={'读书':{title:'📖 读书',content:'暗黑文学+治愈散文'},'听歌':{title:'🎵 听歌',content:'钢琴、后摇、lo-fi'},'看电影':{title:'🎬 看电影',content:'蒂姆·波顿的暗黑童话'},'散步':{title:'🚶 散步',content:'夜里散步，看路灯和影子'},'折腾':{title:'🛠️ 折腾',content:'这个网站就是产物'},'发呆':{title:'😴 发呆',content:'发呆是暗黑系必修课'}};
  function showTag(n){ document.getElementById('tagTitle').textContent=tagInfo[n].title; document.getElementById('tagContent').textContent=tagInfo[n].content; showModal('tagModal'); }
  const itemInfo={'reading':{title:'📖 在读',content:'一本哥特风小说'},'music':{title:'🎵 单曲循环',content:'背景这首钢琴'},'web':{title:'🛠️ 网页',content:'从零开始加雪花弹窗'},'coffee':{title:'☕ 咖啡',content:'手冲翻车中'}};
  function showItem(k){ document.getElementById('itemTitle').textContent=itemInfo[k].title; document.getElementById('itemContent').textContent=itemInfo[k].content; showModal('itemModal'); }
  function avatarClick(){ const a=document.querySelector('.avatar'); a.style.transform='scale(1.2)'; setTimeout(()=>a.style.transform='scale(1)',300); }
  function toggleTheme(){ document.documentElement.getAttribute('data-theme')? document.documentElement.removeAttribute('data-theme'): document.documentElement.setAttribute('data-theme','light'); }
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none'); });
  window.addEventListener('resize',()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; });
</script>
</body>
</html>
