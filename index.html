<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xishahuan - Gothic Dark</title>
  <style>
    /* ========== 哥特暗黑主题 ========== */
    :root {
      --bg: #0d0d0d;
      --text: #cfcfcf;
      --accent: #8b0000;
      --accent2: #5a0000;
      --border: #333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
      line-height: 1.8;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ========== 雪花画布 ========== */
    #snowCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ========== 头部 ========== */
    header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 100px 20px 50px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(to bottom, #1a1a1a, #0d0d0d);
    }
    h1 {
      font-size: 2.8em;
      margin: 0;
      color: #eee;
      letter-spacing: 4px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }
    .subtitle {
      color: #888;
      font-style: italic;
      margin-top: 12px;
      letter-spacing: 1px;
    }

    /* ========== 主体 ========== */
    main {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
      padding: 50px 20px;
    }
    section { margin-bottom: 70px; }
    h2 {
      border-left: 4px solid var(--accent);
      padding-left: 12px;
      color: #ccc;
      font-size: 1.5em;
    }
    p { color: #aaa; }

    /* ========== 音乐按钮 ========== */
    #musicBtn {
      position: fixed;
      bottom: 24px; right: 24px;
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #1e1e24;
      color: #e0e0e0;
      font-size: 24px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #musicBtn:hover {
      background: var(--accent);
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(139,0,0,0.6);
    }

    /* ========== 评论区 ========== */
    .giscus-wrap {
      margin-top: 40px;
      background: #151515;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    /* ========== 页脚 ========== */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 30px;
      border-top: 1px solid var(--border);
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- 雪花 -->
  <canvas id="snowCanvas"></canvas>

  <header>
    <h1>XISHAHUAN</h1>
    <p class="subtitle">Gothic Dark · Piano Resonance · Eternal Night</p>
  </header>

  <main>
    <section>
      <h2>✦ 关于</h2>
      <p>欢迎来到这片暗黑哥特之地。时间在此停滞，唯有钢琴的低语与飘落的灰雪相伴。</p>
    </section>

    <section>
      <h2>✦ 音乐共鸣</h2>
      <p>点击右下角🦇按钮开启背景钢琴曲，建议在深夜佩戴耳机聆听，感受音符在黑暗中流淌。</p>
    </section>

    <!-- Giscus 评论区 -->
    <section>
      <h2>✦ 留言板</h2>
      <div class="giscus-wrap">
        <script src="https://giscus.app/client.js"
          data-repo="xishahuan/xishahuan95-ui"
          data-repo-id="【替换为你的repo-id】"
          data-category="General"
          data-category-id="【替换为你的category-id】"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="dark"
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
        </script>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Xishahuan · Crafted in Darkness</p>
  </footer>

  <!-- 背景音乐（文件在根目录） -->
  <audio id="bgAudio" loop preload="auto">
    <source src="background-music.mp3" type="audio/mpeg">
  </audio>

  <!-- 音乐开关按钮 -->
  <button id="musicBtn" title="播放 / 暂停">🦇</button>

  <script>
    /* ================= 音乐控制 ================= */
    const bgAudio = document.getElementById('bgAudio');
    const musicBtn = document.getElementById('musicBtn');
    let musicOn = false;

    function toggleMusic() {
      if (!musicOn) {
        bgAudio.volume = 0.4;
        bgAudio.play().then(() => {
          musicOn = true;
          musicBtn.textContent = '🎹';
        }).catch(err => {
          console.log('播放被拦截，请再次点击', err);
        });
      } else {
        bgAudio.pause();
        musicOn = false;
        musicBtn.textContent = '🦇';
      }
    }

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMusic();
    });

    // 首次点击页面任意处尝试播放（适配浏览器自动播放策略）
    document.body.addEventListener('click', () => {
      if (!musicOn) toggleMusic();
    }, { once: true });

    /* ================= 雪花效果 ================= */
    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, snowflakes = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Snowflake {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height - height;
        this.r = Math.random() * 2 + 0.5;
        this.d = Math.random() + 0.5;
        this.opacity = Math.random() * 0.5 + 0.3;
      }
      update() {
        this.y += Math.pow(this.d, 2) + 0.5;
        // 轻微左右摇摆
        this.x += Math.sin(this.y * 0.01) * 0.3;
        if (this.y > height) {
          this.y = -10;
          this.x = Math.random() * width;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.fillStyle = "rgba(200,200,220," + this.opacity + ")";
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 150; i++) {
      snowflakes.push(new Snowflake());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      snowflakes.forEach(f => { f.update(); f.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
